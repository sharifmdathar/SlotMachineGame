<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Unity Web Player | SlotMachineGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
            <div id="unity-loading-text">LOADING</div>
          </div>
        </div>

        <div id="unity-warning"></div>

        <div id="unity-fullscreen-button" role="button" tabindex="0" aria-label="Toggle fullscreen" title="Toggle fullscreen"></div>
      </div>
    </div>

    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or a permanent
      // error message on top of the canvas if type == 'error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b42318; color: #fff; padding: 10px; border-radius: 6px;';
        else {
          if (type == 'warning') div.style = 'background: #f5c542; color: #171022; padding: 10px; border-radius: 6px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "DefaultCompany",
        productName: "SlotMachineGame",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Unity keeps the WebGL render target matched to the CSS size of the
      // canvas, so the full-viewport container also controls render resolution
      // automatically while CanvasScaler Expand protects the game layout.
      config.matchWebGLToCanvasSize = true;

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const fullscreenButton = document.querySelector("#unity-fullscreen-button");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = (100 * progress) + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          fullscreenButton.onkeydown = (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              unityInstance.SetFullscreen(1);
            }
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
